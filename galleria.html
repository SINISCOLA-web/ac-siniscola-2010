<script>
(async function(){
const griglia=document.querySelector("button.photo")?.parentElement;
if(!griglia)return;
try{
const risposta=await fetch("https://api.github.com/repos/SINISCOLA-web/ac-siniscola-2010/contents/foto");
if(!risposta.ok)throw Error("Foto non disponibili");
const files=await risposta.json();
const nuove=files.filter(f=>f.type==="file"&&/^[a-f0-9]{8}-[a-f0-9-]{27,}\.(jpg|jpeg|png|webp)$/i.test(f.name)).sort((a,b)=>a.name.localeCompare(b.name));
nuove.forEach((f,i)=>{
const b=document.createElement("button");
b.className="photo";
b.type="button";
b.style.backgroundImage='url("'+f.download_url+'")';
b.innerHTML="<span>FOTO "+(41+i)+"</span>";
b.onclick=()=>{
const sfondo=document.createElement("div");
sfondo.style.cssText="position:fixed;inset:0;background:#000e;z-index:99999;display:flex;align-items:center;justify-content:center;padding:15px";
const img=document.createElement("img");
img.src=f.download_url;
img.style.cssText="max-width:100%;max-height:90vh;object-fit:contain";
sfondo.appendChild(img);
sfondo.onclick=()=>sfondo.remove();
document.body.appendChild(sfondo);
};
griglia.appendChild(b);
});
}catch(e){console.warn("Nuove foto non caricate",e)}
})();
</script>
